<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Mark JS available before first paint, so the "hidden-before-reveal"
       styles only apply when scroll.js can reveal them again. -->
  <script>document.documentElement.classList.add("js");</script>

  <title>Coming Soon — Silicon From Scratch</title>
  <meta name="description"
        content="This part of Silicon From Scratch is on its way." />

  <!-- Social link previews: shared logo + "Silicon From Scratch" card. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Silicon From Scratch" />
  <meta property="og:title" content="Silicon From Scratch" />
  <meta property="og:url" content="https://siliconfromscratch.com/coming-soon/" />
  <meta property="og:image" content="https://siliconfromscratch.com/assets/home/logo.jpg" />
  <meta property="og:image:width" content="1408" />
  <meta property="og:image:height" content="768" />
  <meta property="og:image:alt" content="Silicon From Scratch logo" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Silicon From Scratch" />
  <meta name="twitter:image" content="https://siliconfromscratch.com/assets/home/logo.jpg" />

  <!-- Favicon follows the browser colour scheme: the grey/purple mark on
       light tab bars, the dark-theme symbol on dark ones. -->
  <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/assets/home/logo-symbol-light.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/assets/home/logo-symbol.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
        rel="stylesheet" />

  <!-- Shared site styles (this page lives at /coming-soon/, one level down). -->
  <link rel="stylesheet" href="../styles/main.css" />

  <!-- Center the placeholder content vertically so it sits mid-screen. -->
  <style>
    .coming-soon {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      align-items: center;
      text-align: center;
      border-top: 0;
      padding-block: var(--space-4);
    }
    .coming-soon h1 { margin: var(--space-2) 0 var(--space-3); }
    .coming-soon .kicker { margin-bottom: 0; }
    .coming-soon p { max-width: 42ch; margin-inline: auto; color: var(--soft-ink); }
    /* The shared .about__actions is a left-aligned flex row; centre it here so the
       button sits under the centred "Coming Soon" text. */
    .coming-soon .about__actions { justify-content: center; }

    /* Two "keep learning" stubs: each a link with a little photo-collage of the
       project's diagrams above its title. */
    .learn-cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4);
      width: 100%;
      max-width: 50rem;
      margin: var(--space-5) auto var(--space-4);
    }
    @media (max-width: 640px) { .learn-cards { grid-template-columns: 1fr; } }

    .learn-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-3);
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      color: var(--ink);
      text-decoration: none;
      transition: transform .18s var(--ease), box-shadow .18s var(--ease),
                  border-color .18s var(--ease);
    }
    .learn-card:hover,
    .learn-card:focus-visible {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lift);
      border-color: var(--accent);
    }
    .learn-card:focus-visible { outline: none; }

    /* A "brick wall" of the project's diagrams — bricks of varying size, each
       image shown whole and centred in its brick. Both walls are the same
       height so the two cards line up. */
    .learn-card__collage {
      display: grid;
      gap: 6px;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 168px 88px;   /* big brick on top, short bricks below */
      flex: none;               /* never let the text below squeeze the images */
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .learn-card__collage img {
      display: block;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 10px;
      object-fit: contain;      /* whole diagram, never cropped */
      object-position: center;  /* centred in its brick */
      background: #fff;
    }
    /* Default wall shape: the first image is the large brick across the top, and
       the other two sit smaller, side by side, beneath it.
       Single Cycle CPU -> datapath on top, R-type + fetch-decode-execute below. */
    .learn-card__collage--3 img:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
    .learn-card__collage--3 img:nth-child(2) { grid-column: 1; grid-row: 2; }
    .learn-card__collage--3 img:nth-child(3) { grid-column: 2; grid-row: 2; }
    /* ALU wall: the MSB slice fills the whole left column, and the ALU block +
       adder-subtractor stack down the right column beside it. The adder-subtractor
       takes about three quarters of the right column's height. Total height still
       sums to 304px so this card lines up with the Single Cycle CPU card. */
    .learn-card[href*="alu"] .learn-card__collage { grid-template-rows: 64px 192px; }
    .learn-card[href*="alu"] .learn-card__collage img:nth-child(1) { grid-column: 1; grid-row: 1 / 3; }
    .learn-card[href*="alu"] .learn-card__collage img:nth-child(2) { grid-column: 2; grid-row: 1; padding: 6px; }
    .learn-card[href*="alu"] .learn-card__collage img:nth-child(3) { grid-column: 2; grid-row: 2; padding: 0; }
    /* Single Cycle CPU brick tweaks: widen the R-type brick and let it sit high
       and large (its own whitespace is already trimmed), and shrink the
       fetch-decode-execute circle so it sits centred and fully inside its brick. */
    .learn-card[href*="single-cycle-cpu"] .learn-card__collage { grid-template-columns: 1.4fr 1fr; }
    .learn-card[href*="single-cycle-cpu"] .learn-card__collage img:nth-child(2) { object-position: top; padding: 4px; }
    .learn-card[href*="single-cycle-cpu"] .learn-card__collage img:nth-child(3) { object-position: top; padding: 8px; }

    .learn-card__foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-top: auto;   /* keep the title pinned to the bottom of the card */
    }
    .learn-card__title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.15rem;
      text-align: left;
    }
    .learn-card__arrow { color: var(--accent); font-size: 1.35rem; flex: none;
      transition: transform .18s var(--ease); }
    .learn-card:hover .learn-card__arrow { transform: translateX(4px); }
  </style>
</head>
<body class="theme-dark">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ============================== TOP BAR ============================== -->
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="wordmark" href="../" aria-label="Silicon From Scratch — home">
        <img class="wordmark__mark" src="../assets/home/logo-symbol.png" alt="" aria-hidden="true" />
        Silicon From Scratch
      </a>

      <!-- main.js rebuilds this nav into the nested project menu. -->
      <nav class="nav" id="primary-nav" aria-label="Primary"></nav>

      <div class="topbar__right">
        <div class="toc" id="page-toc">
          <ul class="toc__menu" aria-label="Sections on this page"></ul>
        </div>

        <button class="nav-toggle" id="nav-toggle"
                aria-label="Toggle navigation menu"
                aria-expanded="false" aria-controls="primary-nav">
          <span class="nav-toggle__bars" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <span id="top"></span>

    <!-- ============================= COMING SOON ========================= -->
    <section class="section coming-soon" aria-labelledby="soon-title">
      <div class="container">
        <h1 id="soon-title">Coming Soon</h1>
        <p>
          This part of the path is on its way. Check back soon, or explore
          any of these projects in the meantime.
        </p>

        <div class="learn-cards">
          <a class="learn-card" href="../alu/logic-gates/">
            <span class="learn-card__collage learn-card__collage--3" aria-hidden="true">
              <img src="../assets/ALU/slice-architecture-msb.jpg" alt="" decoding="async" />
              <img src="../assets/ALU/alu-block.jpg" alt="" decoding="async" />
              <img src="../assets/ALU/adder-subtractor-aligned.jpg" alt="" decoding="async" />
            </span>
            <span class="learn-card__foot">
              <span class="learn-card__title">Learn the ALU</span>
              <span class="learn-card__arrow" aria-hidden="true">&rarr;</span>
            </span>
          </a>

          <a class="learn-card" href="../single-cycle-cpu/basics-of-instructions/">
            <span class="learn-card__collage learn-card__collage--3" aria-hidden="true">
              <img src="../assets/single-cycle-cpu/sc-cpu-architecture.jpg" alt="" decoding="async" />
              <img src="../assets/single-cycle-cpu/r-type-crop.jpg" alt="" decoding="async" />
              <img src="../assets/single-cycle-cpu/fde.jpg" alt="" decoding="async" />
            </span>
            <span class="learn-card__foot">
              <span class="learn-card__title">Learn the Single Cycle CPU</span>
              <span class="learn-card__arrow" aria-hidden="true">&rarr;</span>
            </span>
          </a>
        </div>

        <div class="about__actions">
          <button class="btn btn--primary js-open-proj-dir" type="button">Open Project Directory</button>
        </div>
      </div>
    </section>
  </main>

  <!-- =============================== FOOTER ============================== -->
  <footer class="footer">
    <div class="container footer__inner">
      <a class="wordmark" href="#top" aria-label="Silicon From Scratch — back to top">
        <span class="wordmark__dot" aria-hidden="true"></span>
        Silicon From Scratch
      </a>
      <a href="https://github.com/estaresinic05/Silicon-From-Scratch"
         target="_blank" rel="noopener">GitHub Repository</a>
    </div>
  </footer>

  <script src="../scripts/main.js" defer></script>
  <!-- Enlarge: static figure images pop on hover and open enlarged on a
       blurred backdrop when clicked (see scripts/enlarge.js). -->
  <script src="../scripts/enlarge.js" defer></script>
</body>
</html>
